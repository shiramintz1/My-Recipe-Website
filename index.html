<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחברת המתכונים שלי</title>
<script>try{var t=JSON.parse(localStorage.getItem("theme_v1")||"{}"),d=t.mode==="dark"||((t.mode||"auto")==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.mode=d?"dark":"light";document.documentElement.dataset.palette=t.palette||"sage"}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bgL:#fbfaf6;--bgD:#141912;--a:#4a6741;--ad:#3a5233;--b:#f0c75e;--on-a:#fff;--r:18px;--font:"Heebo","Assistant","Segoe UI",Arial,sans-serif;--bg:var(--bgL);--ink:#20241d;--surface:#fff;--sage:var(--a);--sage-d:var(--ad);--butter:var(--b);--muted:color-mix(in srgb,var(--ink) 62%,var(--bg));--line:color-mix(in srgb,var(--ink) 13%,var(--bg));--surface2:color-mix(in srgb,var(--ink) 7%,var(--bg));--sage-l:color-mix(in srgb,var(--a) 15%,var(--surface));--link:var(--ad);--danger-bg:#fbe5e0;--danger-t:#a2301d;color-scheme:light}
html[data-mode=dark]{--bg:var(--bgD);--ink:#efede5;--surface:color-mix(in srgb,var(--bg) 87%,#fff);--link:color-mix(in srgb,var(--a) 55%,#fff);--danger-bg:#3d1d17;--danger-t:#ff9a86;color-scheme:dark}
html[data-palette=walnut]{--bgL:#f8f1e5;--bgD:#1b1510;--a:#7a5238;--ad:#5e3f2b;--b:#d9a441}
html[data-palette=tomato]{--bgL:#fdf8f2;--bgD:#1c1413;--a:#c0392b;--ad:#9e2c20;--b:#f0c75e}
html[data-palette=ocean]{--bgL:#f4f9fb;--bgD:#0e1a21;--a:#23698f;--ad:#1a5273;--b:#f2c14e}
html[data-palette=berry]{--bgL:#fbf5f9;--bgD:#1a111a;--a:#8e3b6e;--ad:#722e58;--b:#f0b45a}
html[data-palette=matte]{--bgL:#f6f5f1;--bgD:#121211;--a:#26241f;--ad:#000;--b:#c9a24b}
html[data-mode=dark][data-palette=matte]{--a:#c9a24b;--ad:#b08d3d;--on-a:#1d1b18;--b:#e0bf6a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6}
button{font:inherit;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
svg{flex:none}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--sage)}
.btn{background:var(--sage);color:#fff}.btn:hover{background:var(--sage-d)}
.btn2{background:#eeeee6;color:var(--ink)}.btn2:hover{background:#e4e4da}
.danger{background:#fbe5e0;color:#a2301d}

/* תפריט */
nav{position:sticky;top:0;z-index:30;background:#fbfaf6ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:4px;padding:10px 18px}
.logo{background:none;color:var(--ink);font-size:21px;font-weight:800;padding:4px 0;margin-left:auto;letter-spacing:-.3px}
.logo span{color:var(--sage)}
.nl{background:none;color:var(--muted);padding:9px 15px;font-weight:600}
.nl:hover{background:#eeeee6;color:var(--ink)}
.nl.on{background:var(--sage-l);color:var(--sage-d)}
.nl .t{font-size:15px}
.nav-add{background:var(--sage);color:#fff;margin-right:6px}.nav-add:hover{background:var(--sage-d);color:#fff}
.mw{position:relative}
.pop{position:absolute;left:0;top:115%;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px #0002;padding:8px;min-width:260px;display:none}
.pop.open{display:block}
.pop button{display:block;width:100%;text-align:right;background:none;border-radius:10px;font-weight:600;padding:11px 14px;color:var(--ink)}
.pop button:hover{background:#f1f1ea}
.pop small{display:block;color:var(--muted);font-weight:400}

/* בית */
.hero{position:relative;min-height:440px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(135deg,#3a5233,#6b8a5c);background-size:cover;background-position:center}
.hero-in{max-width:1180px;margin:auto;width:100%;padding:60px 18px 50px}
.hero h1{font-size:clamp(34px,6.5vw,64px);line-height:1.08;margin:0 0 12px;font-weight:800;letter-spacing:-1px;max-width:680px;text-shadow:0 2px 20px #0006}
.hero p{font-size:18px;margin:0 0 24px;max-width:500px;text-shadow:0 1px 10px #0007}
.search{display:flex;gap:6px;max-width:580px;background:#fff;padding:6px;border-radius:999px;box-shadow:0 12px 40px #0004}
.search input{border:0;background:none;font-size:17px;color:var(--ink)}
.search input:focus{outline:0}
.search:focus-within{outline:3px solid var(--butter)}
.hero-tip{position:absolute;top:14px;left:14px}
.hero-tip button{background:#0006;color:#fff;font-size:13px;padding:7px 14px;font-weight:600}
.hero-tip button:hover{background:#000a}
.wrap{max-width:1180px;margin:auto;padding:0 18px}
.sec{margin:46px 0 16px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px}
.link{background:none;color:var(--sage);padding:4px 8px;font-weight:700}.link:hover{text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;padding:0;color:#fff;text-align:right;background:var(--sage);display:block;width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile:hover img{transform:scale(1.05)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#000a)}
.tile .l{position:absolute;bottom:14px;right:16px;left:16px;z-index:1;font-size:21px;font-weight:800;line-height:1.2}
.tile .l small{display:block;font-size:13px;font-weight:500;opacity:.9}
.tile.ph{background:var(--sage-l);color:var(--sage-d)}
.tile.ph::after{background:none}
.tile.ph svg{position:absolute;top:14px;left:14px;opacity:.5}
.welcome{background:#fff;border:2px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;margin-top:40px}
.welcome h2{margin:0 0 6px;font-size:26px}

/* כרטיסים */
.page{max-width:1180px;margin:auto;padding:30px 18px 70px}
.page h1{font-size:34px;font-weight:800;margin:0 0 4px;letter-spacing:-.5px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tools input{flex:1 1 240px}.tools select{width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{background:#fff;border:1.5px solid var(--line);color:var(--ink);padding:8px 17px;white-space:nowrap;font-weight:600}
.chip:hover{border-color:var(--sage)}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.row{display:flex;gap:18px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.row .card{flex:0 0 290px;scroll-snap-align:start}
.card{position:relative;cursor:pointer;background:none;text-align:right}
.cover{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--sage-l);display:grid;place-items:center;color:var(--sage);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .cover img{transform:scale(1.05)}
.cover .np{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;opacity:.75}
.hb{position:absolute;top:10px;left:10px;background:#fffffff0;width:40px;height:40px;padding:0;color:#b53a28;box-shadow:0 2px 10px #0003}
.hb svg{width:20px;height:20px}
.pc{position:absolute;bottom:10px;right:10px;background:#000a;color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
.card h3{font-size:20px;font-weight:800;margin:12px 0 4px;overflow-wrap:anywhere;line-height:1.3}
.sub{font-size:14px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;background:#fff;border:2px dashed var(--line);border-radius:var(--r)}

/* חלון */
.modal{position:fixed;inset:0;z-index:50;background:#14180fb8;display:none;overflow-y:auto;padding:22px 12px 90px}
.modal.open{display:block}
.sheet{max-width:860px;margin:auto;background:var(--bg);border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #0008}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.bar .sp{margin-right:auto}
.body{padding:22px 28px 34px}
.title{font-size:36px;font-weight:800;margin:0 0 10px;line-height:1.15;letter-spacing:-.5px}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{background:#eeeee6;border-radius:999px;padding:3px 13px;font-size:13px;font-weight:600}
.tag.t{background:var(--sage);color:#fff}
.gal{margin:0;position:relative;background:#e9eadf}
.gal .m{width:100%;max-height:480px;aspect-ratio:16/10;object-fit:cover;display:block}
.thumbs{display:flex;gap:8px;padding:10px 28px 0;flex-wrap:wrap}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:12px;cursor:pointer;border:3px solid transparent}
.thumbs img.on{border-color:var(--sage)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:20px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.sheet h3{font-size:23px;font-weight:800;margin:28px 0 10px}
.ing{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.ing::before{content:"";flex:0 0 22px;height:22px;border:2px solid var(--sage);border-radius:50%;margin-top:2px}
.ing.done{color:#9a9d92;text-decoration:line-through}
.ing.done::before{background:var(--sage);box-shadow:inset 0 0 0 4px var(--bg)}
.step{display:flex;gap:14px;padding:10px 0}
.step i{flex:0 0 32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.tip{background:#fff6dc;border-right:5px solid var(--butter);padding:14px 18px;border-radius:12px;white-space:pre-wrap}
.note{white-space:pre-wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-weight:700;font-size:14px}
.full{grid-column:1/-1}
textarea{min-height:110px;resize:vertical}
.group{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;grid-column:1/-1}
.group h4{margin:0 0 10px;font-size:16px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.drop{border:2px dashed #b9c8ae;border-radius:18px;padding:28px 16px;text-align:center;background:var(--sage-l);cursor:pointer;color:var(--sage-d)}
.drop.over{background:#d6e5c8;border-color:var(--sage)}
.drop b{font-size:18px;display:block}
.edthumbs{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.et{position:relative;width:104px;height:104px}
.et img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.et.cp img{outline:3px solid var(--sage);outline-offset:2px}
.et button{position:absolute;padding:0}
.et .x{top:-8px;right:-8px;width:28px;height:28px;background:#a2301d;color:#fff;font-size:14px}
.et .c{bottom:-8px;right:8px;background:var(--ink);color:#fff;font-size:12px;padding:1px 11px}
.checks{flex-direction:row;gap:26px;flex-wrap:wrap}.checks label{display:flex;gap:8px;align-items:center;font-weight:500}.checks input{width:auto}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 24px;border-radius:999px;display:none;z-index:70}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 16px 100px}
.err{color:var(--danger-t);font-weight:600;min-height:1.4em;margin:0}
.login{max-width:420px;margin:auto}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;background:#fffffff5}
  .nav-in{padding:4px 6px;justify-content:space-around;gap:0}
  .logo{display:none}
  .nl{flex-direction:column;gap:1px;padding:6px 4px;flex:1;border-radius:12px;font-size:11px}
  .nl .t{font-size:11px}
  .nav-add{margin:0;flex:0 0 52px;height:52px;border-radius:50%;margin-top:-18px;padding:0;box-shadow:0 6px 18px #0004}
  .nav-add .t{display:none}
  .pop{top:auto;bottom:115%;left:auto;right:0}
  .hero{min-height:380px}.hero-in{padding:50px 18px 36px}
  .tiles{grid-template-columns:1fr 1fr}
  .grid,.fg{grid-template-columns:1fr}.full{grid-column:auto}
  .times{grid-template-columns:1fr 1fr}
  .body{padding:18px 16px 28px}.thumbs{padding:10px 16px 0}
  .modal{padding:0 0 70px}.sheet{border-radius:0}
  .row .card{flex-basis:80%}
  .title{font-size:29px}
}
@media print{nav,.bar,.hero,footer,.thumbs{display:none!important}.modal{position:static;background:none;padding:0}.sheet{box-shadow:none}body>*:not(.modal){display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* המרת מידות */
.conv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:16px}
.cv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.cv h3{margin:0 0 8px;font-size:20px;color:var(--link)}
.cv .ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.cv .ln:last-child{border:0}.cv .ln b{white-space:nowrap}
.cnotes{background:var(--surface);border-right:5px solid var(--butter);border-radius:12px;padding:14px 22px;margin-top:18px}
.cnotes ol{margin:6px 0 0;padding-right:20px}
@media(max-width:900px){.conv{grid-template-columns:1fr}}

/* ערכות נושא */
input,textarea,select{background:var(--surface)}
.btn,.nav-add,.nav-add:hover,.chip.on,.tag.t,.seg button.on{color:var(--on-a)}
.btn2{background:var(--surface2)}.btn2:hover{background:color-mix(in srgb,var(--ink) 12%,var(--bg))}
.danger{background:var(--danger-bg);color:var(--danger-t)}
nav{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.nl:hover{background:var(--surface2)}.nl.on{color:var(--link)}
.logo span,.link,.drop,.tile.ph{color:var(--link)}
.pop{background:var(--surface)}.pop button:hover{background:var(--surface2)}
.search{background:var(--surface)}.search input{color:var(--ink)}
.welcome,.empty,.chip,.stat,.group,.bar{background:var(--surface)}
.tag{background:var(--surface2)}.gal{background:var(--surface2)}
.ing.done{color:var(--muted)}
.tip{background:color-mix(in srgb,var(--butter) 20%,var(--surface))}
.drop{border-color:color-mix(in srgb,var(--sage) 45%,var(--surface))}.drop.over{background:color-mix(in srgb,var(--sage) 28%,var(--surface))}
#toast,.step i{background:var(--ink);color:var(--bg)}
.hero{background-image:linear-gradient(135deg,var(--ad),var(--a))}
.tp{min-width:300px;padding:14px}
.tl{font-weight:700;font-size:13px;color:var(--muted);margin:8px 4px 8px}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px}
.seg button{flex:1;padding:8px 6px;background:none;font-size:14px;color:var(--ink);border-radius:999px;text-align:center}
.seg button.on{background:var(--sage)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sw button{background:none;border:2px solid transparent;border-radius:14px;padding:8px 10px;justify-content:flex-start;color:var(--ink);font-weight:600;font-size:14px;width:auto}
.sw button:hover{background:var(--surface2)}.sw button.on{border-color:var(--sage)}
.sw i{width:26px;height:26px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--line)}
@media(max-width:640px){
  .pop{position:fixed;left:10px;right:10px;bottom:76px;top:auto;min-width:0}
  .mw{flex:1;display:flex;min-width:0}.nl{min-width:0}
}

/* ייבוא ו-טיימר */
.hz{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ibox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.ibox ol{margin:0 0 14px;padding-right:20px}
.qph{position:absolute;bottom:10px;right:10px;background:var(--surface);color:var(--ink);font-size:13px;padding:6px 14px;box-shadow:0 2px 10px #0003}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:8px 0}
.pv summary{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.pv summary::-webkit-details-marker{display:none}
.pv summary input{width:22px;height:22px;flex:none;padding:0;accent-color:var(--sage)}
.pv summary b{flex:1;overflow-wrap:anywhere}
.pv .fg{padding:4px 14px 16px}.pv.dup{opacity:.65}
.tbtn{background:var(--sage-l);color:var(--link);padding:2px 10px;font-size:13px;margin-right:8px;vertical-align:middle}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:18px 0}
.tray{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 24px));z-index:80;display:flex;flex-direction:column;gap:8px}
.tmr{background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px #0006}
.tmr.done{background:#c0392b;color:#fff;animation:pulse 1s infinite}
.tmr .tt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:80px}
.tmr .tl2{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmr button{padding:6px 12px;font-size:13px;background:#ffffff2e;color:inherit}
@keyframes pulse{50%{opacity:.7}}
@media(prefers-reduced-motion:reduce){.tmr.done{animation:none}}
@media(max-width:640px){.tray{bottom:76px}body.adm .nl{padding:6px 0;font-size:10px}body.adm .nl .t{font-size:10px}body.adm .nl svg{width:20px;height:20px}}
@media print{.tray{display:none}}
</style>
</head>
<body>

<nav aria-label="תפריט ראשי"><div class="nav-in">
  <button class="logo" data-go="home">מחברת <span>המתכונים</span></button>
  <button class="nl" data-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span class="t">בית</span></button>
  <button class="nl" data-go="recipes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.500" y="3" width="7.500" height="7.500" rx="2"/><rect x="3" y="13.500" width="7.500" height="7.500" rx="2"/><rect x="13.500" y="13.500" width="7.500" height="7.500" rx="2"/></svg><span class="t">מתכונים</span></button>

function norm(r){if(!r.photos){r.photos=r.photo?[r.photo]:[]}delete r.photo;if(r.fav===undefined)r.fav=!!r.favorite;r.created=r.created||Date.now();return r}
async function loadAll(){
  if(!sb)throw new Error("לא הוגדרו פרטי Supabase בקובץ");
  const {data,error}=await sb.from("recipes").select("recipe_key,data");
  if(error)throw error;
  const out=[];
  for(const row of data||[]){
    const d=row.data||{},k=row.recipe_key||"";
    if(k==="__hero"){hero=d.photo||"";continue}
    if(k.startsWith("__")||!d.name)continue;
    out.push(norm({...d,id:k}));
  }
  return out;
}
async function put(r){const {error}=await sb.from("recipes").upsert({recipe_key:r.id,title:r.name||"ללא שם",data:r},{onConflict:"recipe_key"});if(error)throw error}
async function del(id){const {error}=await sb.from("recipes").delete().eq("recipe_key",id);if(error)throw error}
async function uploadImage(blob,folder){
  const path=folder+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function resolvePhotos(list,folder){
  const out=[];
  for(const p of list){
    if(p.startsWith("data:")){const b=await (await fetch(p)).blob();out.push(await uploadImage(b,folder))}
    else out.push(p);
  }
  return out;
}
function removeFiles(urls){
  const m="/object/public/"+BUCKET+"/";
  const paths=urls.map(u=>{const i=u.indexOf(m);return i<0?null:decodeURIComponent(u.slice(i+m.length).split("?")[0])}).filter(Boolean);
  if(paths.length)sb.storage.from(BUCKET).remove(paths).catch(()=>{});
}
async function saveHero(dataUrl){
  const b=await (await fetch(dataUrl)).blob();const url=await uploadImage(b,"hero");
  const {error}=await sb.from("recipes").upsert({recipe_key:"__hero",title:"__hero",data:{photo:url}},{onConflict:"recipe_key"});
  if(error)throw error;

}

const BIDI=/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,EMO=/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu;

const STEPV=new RegExp("^ו?(?:(?:"+VERBS+")|ל(?:"+INFS+")[א-ת]*)(?=\\s|$|,)");

function maybeFlip(lines){const rev=w=>[...w].reverse().join(""),t=lines.join("\n");let f=0,r=0;FWD.forEach(w=>{f+=t.split(w).length-1;r+=t.split(rev(w)).length-1});

function guess(name,ing,steps){
  const all=(name+" "+ing+" "+steps).replace(/אבקת (?:מרק )?(?:עוף|בקר|בשר)|קובי(?:ית|ות) (?:מרק )?(?:עוף|בשר)/g,"");
  const dairy=/חמאה|חלב|גבינה|שמנת|יוגורט|קוטג|מסקרפונה|פרמזן|מוצרלה|ריבת חלב/.test(all);
  const type=/עוף|בשר|בקר|הודו|נקניק|שניצל|פרגית|פרגיות|כבד|המבורגר/.test(all)&&!dairy?"בשרי":dairy?"חלבי":"פרווה";
  const category=/^עוגת|^עוגה|שיש/.test(name)?"עוגות":/עוגיות|כדורי|שושני|חיתוכיות|ריבועי|קוקילידות|פצפוצי|שומשומיות/.test(name)?"עוגיות וממתקים":/מרק/.test(name)?"מרקים":/סלט/.test(name)?"סלטים":/לחם|לחמניות|פיצה|פוקצ|לחוח|פרנה|רוגעלך|פריושקי|בייגלה/.test(name)?"לחמים ומאפים":/קרפ|פנקייק|וופל|סופגניות|צ'ורוס|אלפחורס|פחזניות|סופלה|מעדן|קרם|אייס|משקה/.test(name)?"קינוחים":/פסטה|אורז|תפוחי אדמה|קוגל|פשטיד|קציצות|פרגיות|רוטב/.test(name)?"ארוחות":"";
  const taste=["מרקים","ארוחות","סלטים"].includes(category)?"מלוח":["עוגות","עוגיות וממתקים","קינוחים"].includes(category)?"מתוק":category==="לחמים ומאפים"?(/שוקולד|קינמון|רוגעלך/.test(name+" "+ing)?"מתוק":"מלוח"):/סוכר|שוקולד|קקאו|דבש|סירופ|פודינג|נוטלה|וניל/.test(name+" "+ing)?"מתוק":"מלוח";

function recTimes(steps){
  let bake=0,cook=0;const t=(steps.match(/(\d{2,3})\s*[-–]?\s*(?:מעלות|°)/)||[])[1]||"";
  steps.split(/(?<=[.!?])\s+|\n/).forEach(s=>{const m=s.match(/(\d+)(?:\s*[-–]\s*(\d+))?\s*[-–]?\s*(?:דקות|דק'|דק׳)/);if(!m)return;const n=+(m[2]||m[1]);
    if(/אפ|אופ|תנור/.test(s))bake=Math.max(bake,n);else if(/בשל|מרתיח|שמים/.test(s))cook=Math.max(cook,n)});

function parseBlock(lines){
  lines=lines.filter(Boolean);if(lines.length<2)return null;
  let raw=lines[0],rest=lines.slice(1),credit="",servings="";
  const sv=raw.match(/\(([^)]*\d[^)]*)\)\s*$/);if(sv){servings=sv[1].trim();raw=raw.replace(sv[0],"").trim()}
  const parts=raw.split(/\s+\/\s*|\s*\/\s+/);raw=parts[0].trim();if(parts[1])credit=parts.slice(1).join(" / ").trim();
  let k=rest.findIndex((l,i)=>isStep(l,rest[i-1]));if(k<0)k=rest.length;
  const ing=rest.slice(0,k),st=rest.slice(k),steps=[];let cur="";
  st.forEach(l=>{if(cur&&(/[.!?]$/.test(cur)||(STEPV.test(l)&&!/[,־-]$/.test(cur))))
    {steps.push(cur);cur=l}else cur=cur?cur+" "+l:l});if(cur)steps.push(cur);
  const flat=[];steps.forEach(s=>s.split(/(?<=[.!?])\s+(?=\S)/).forEach(x=>{x=x.replace(/^\d+[.)]\s*/,"").trim();if(x)flat.push(x)}));

function parseRecipes(text){
  let lines=text.split(/\r?\n/).map(cleanLine);
  lines=lines.filter(l=>!/^(?:בס"ד|בס״ד|בע"ה|בעזרת השם|בס'ד)$/.test(l));

    tc.items.forEach(i=>{if(!i.str||!i.str.trim())return;const y=i.transform[5],h=Math.abs(i.transform[3])||10;let r=rows.find(r=>Math.abs(r.y-y)<h*.45);if(!r){r={y,h,items:[]};rows.push(r)}r.items.push(i)});

const TR={list:[],iv:0,ac:null,wl:null};

function actx(){try{TR.ac=TR.ac||new (window.AudioContext||window.webkitAudioContext)();if(TR.ac.state==="suspended")TR.ac.resume()}catch(e){}return TR.ac}
function beep3(){const a=actx();if(a)[0,.3,.6].forEach(o=>{const s=a.createOscillator(),g=a.createGain(),t=a.currentTime+o;s.frequency.value=880;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);s.connect(g);g.connect(a.destination);s.start(t);s.stop(t+.25)});if(navigator.vibrate)navigator.vibrate([300,150,300])}
async function wake(){try{if("wakeLock" in navigator&&!TR.wl)TR.wl=await navigator.wakeLock.request("screen")}catch(e){}}

function addTimer(label,min){const secs=Math.round(min*60);if(!(secs>0))return;actx();

function stepTimes(x){const out=[],re=/(\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?\s*[-–]?\s*(דקות|דק'|דק׳|דקה|שעות|שעה)/g;let m;
